<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600">
  <!-- Imagen genérica de locutor (micrófono de estudio). Reemplazar por la foto real. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#0C0C0C"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" x2="1">
      <stop offset="0" stop-color="#4A4A4A"/>
      <stop offset=".3" stop-color="#E6E6E6"/>
      <stop offset=".55" stop-color="#8A8A8A"/>
      <stop offset=".78" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <clipPath id="head"><rect x="170" y="120" width="140" height="210" rx="70"/></clipPath>
  </defs>
  <rect width="480" height="600" fill="url(#bg)"/>
  <g fill="none" stroke-width="2">
    <circle cx="240" cy="225" r="150" stroke="#FF0000" opacity=".22"/>
    <circle cx="240" cy="225" r="192" stroke="#FFFFFF" opacity=".06"/>
    <circle cx="240" cy="225" r="236" stroke="#FFFFFF" opacity=".04"/>
  </g>
  <!-- cabeza del micrófono -->
  <rect x="170" y="120" width="140" height="210" rx="70" fill="url(#chrome)"/>
  <g clip-path="url(#head)" stroke="#1A1A1A" stroke-width="3" opacity=".45">
    <path d="M160 142H320M160 156H320M160 170H320M160 184H320M160 198H320M160 212H320M160 254H320M160 268H320M160 282H320M160 296H320M160 310H320"/>
  </g>
  <rect x="170" y="222" width="140" height="18" fill="#FF0000"/>
  <!-- horquilla, vástago y base -->
  <path d="M146 228v22a94 94 0 0 0 188 0v-22" fill="none" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>
  <rect x="232" y="343" width="16" height="132" fill="url(#chrome)"/>
  <ellipse cx="240" cy="488" rx="92" ry="18" fill="#1A1A1A"/>
  <rect x="148" y="470" width="184" height="18" rx="9" fill="url(#chrome)"/>
</svg>
